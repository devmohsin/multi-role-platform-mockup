<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brightway Academy</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
  :root{
    --bg:#F4F5F7; --surface:#FFFFFF; --surface2:#EEF0F4; --ink:#1A2333; --ink2:#5C6575; --ink3:#8B93A3;
    --line:#E4E7EC; --line2:#D3D8E0;
    --primary:#D7262F; --primary-hover:#B31D26; --primary-ink:#FFFFFF; --primary-soft:#FBE9EA; --primary-soft-ink:#A5121F;
    --navy:#13203F; --navy-ink:#FFFFFF;
    --accent:#A87F24; --accent-soft:#F5EDDA; --accent-ink:#7C5E13;
    --good:#25754A; --good-soft:#E0F0E6; --warn:#9E620E; --warn-soft:#F7EDD8; --bad:#7E3B2E; --bad-soft:#F4E6E0;
    --hero:#101B38;
    --shadow:0 1px 2px rgba(26,35,51,.05),0 3px 12px rgba(26,35,51,.06);
    --shadow-lg:0 4px 12px rgba(26,35,51,.10),0 16px 48px rgba(26,35,51,.16);
    --star:#C9971F;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0F1524; --surface:#161F33; --surface2:#1F2941; --ink:#E8ECF4; --ink2:#A6AFC2; --ink3:#727C92;
      --line:#28324B; --line2:#39445F;
      --primary:#F0666E; --primary-hover:#F4838A; --primary-ink:#26070A; --primary-soft:#3D1E28; --primary-soft-ink:#F5A3A8;
      --navy:#0C1730; --navy-ink:#E8ECF4;
      --accent:#D9B15E; --accent-soft:#322A17; --accent-ink:#E7C077;
      --good:#63B888; --good-soft:#20362A; --warn:#DBA255; --warn-soft:#382E1C; --bad:#DE9A8A; --bad-soft:#3B2622;
      --hero:#0B142B;
      --shadow:0 1px 2px rgba(0,0,0,.25),0 4px 16px rgba(0,0,0,.25);
      --shadow-lg:0 4px 12px rgba(0,0,0,.35),0 16px 48px rgba(0,0,0,.45);
      --star:#E0AC4C;
    }
  }
  :root[data-theme="dark"]{
    --bg:#131D1A; --surface:#1B2823; --surface2:#233129; --ink:#E7EDEA; --ink2:#A3B2AC; --ink3:#71807A;
    --line:#2C3B35; --line2:#3A4A43;
    --primary:#4FB99E; --primary-hover:#67C9B0; --primary-ink:#0C1F1A; --primary-soft:#1E3831; --primary-soft-ink:#8FD4C2;
    --accent:#E0AC4C; --accent-soft:#37301C; --accent-ink:#E7C077;
    --good:#63B888; --good-soft:#20362A; --warn:#DBA255; --warn-soft:#382E1C; --bad:#DE8272; --bad-soft:#3B2622;
    --shadow:0 1px 2px rgba(0,0,0,.25),0 4px 16px rgba(0,0,0,.25);
    --shadow-lg:0 4px 12px rgba(0,0,0,.35),0 16px 48px rgba(0,0,0,.45);
    --star:#E0AC4C;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font:15px/1.55 "Public Sans",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
  h1,h2,h3{font-family:"Archivo","Public Sans",sans-serif;font-weight:700;line-height:1.2;margin:0;text-wrap:balance;letter-spacing:-.01em}
  button{font:inherit;cursor:pointer;border:none;background:none;color:inherit;padding:0}
  input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line2);border-radius:8px;padding:9px 12px;width:100%}
  input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--primary);outline-offset:1px}
  a{color:var(--primary)}
  @media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 16px;border-radius:8px;font-weight:600;font-size:14px;border:1px solid transparent;transition:background .15s;font-family:"Archivo","Public Sans",sans-serif;letter-spacing:.01em}
  .btn-primary{background:var(--primary);color:var(--primary-ink)}
  .btn-primary:hover{background:var(--primary-hover)}
  .btn-ghost{border-color:var(--line2);color:var(--ink)}
  .btn-ghost:hover{background:var(--surface2)}
  .btn-danger{background:var(--bad-soft);color:var(--bad)}
  .btn-good{background:var(--good);color:#fff}
  .btn-warnful{background:var(--warn);color:#fff}
  .btn-bad{background:var(--bad);color:#fff}
  .btn-sm{padding:5px 11px;font-size:13px;border-radius:7px}
  .btn[disabled]{opacity:.55;cursor:default}

  .chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:6px;font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
  .chip-primary{background:var(--primary-soft);color:var(--primary-soft-ink)}
  .chip-accent{background:var(--accent-soft);color:var(--accent-ink)}
  .chip-good{background:var(--good-soft);color:var(--good)}
  .chip-warn{background:var(--warn-soft);color:var(--warn)}
  .chip-bad{background:var(--bad-soft);color:var(--bad)}
  .chip-muted{background:var(--surface2);color:var(--ink2)}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
  .card-pad{padding:20px}
  .eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink2)}
  .muted{color:var(--ink2)} .tiny{font-size:12.5px} .small{font-size:13.5px}
  .num{font-variant-numeric:tabular-nums}
  .avatar{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:var(--primary-soft);color:var(--primary-soft-ink);font-weight:700;flex:none}
  .stars{color:var(--star);letter-spacing:1px;white-space:nowrap}

  /* ------- landing / picker ------- */
  .brandmark{display:inline-flex;align-items:center;gap:10px;font-family:"Archivo","Public Sans",sans-serif;font-size:20px;font-weight:700}
  .brandmark .bm-dot{width:30px;height:30px;border-radius:9px;background:var(--primary);color:var(--primary-ink);display:inline-flex;align-items:center;justify-content:center;font-size:15px}
  .hero{background:var(--hero);color:#F4F2EA;padding:40px 22px 108px;position:relative;overflow:hidden}
  .hero::before{content:"";position:absolute;left:50%;top:-340px;transform:translateX(-50%);width:900px;height:640px;border-radius:50%;background:radial-gradient(closest-side, rgba(224,172,76,.16), transparent);pointer-events:none}
  .hero-in{max-width:1080px;margin:0 auto;position:relative;text-align:center}
  .hero .brandmark{color:#F4F2EA}
  .hero .bm-dot{background:var(--primary);color:#fff}
  .masthead{background:#B01823;color:rgba(255,251,248,.9);font-size:11.5px;letter-spacing:.02em;padding:5px 18px;display:flex;gap:7px;align-items:center}
  .masthead b{color:#F6DFA4;font-weight:700}
  .ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
  .cdot{width:30px;height:30px;border-radius:8px;background:var(--navy);color:var(--navy-ink);display:inline-flex;align-items:center;justify-content:center;font-family:"Archivo","Public Sans",sans-serif;font-weight:700;font-size:13px;flex:none}
  .hero h1{font-size:clamp(34px,5vw,54px);margin:36px 0 14px;color:#FDFCF7;letter-spacing:-.02em;font-weight:800}
  .hero .lede{max-width:56ch;margin:0 auto;color:rgba(244,242,234,.78);font-size:16px}
  .hero-stats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:26px}
  .hero-stat{background:rgba(244,242,234,.09);border:1px solid rgba(244,242,234,.18);border-radius:99px;padding:7px 16px;font-size:13px;font-weight:600;color:#F4F2EA}
  .hero-stat b{color:#EFC878}
  .demo-note{display:inline-flex;gap:9px;align-items:flex-start;text-align:left;background:rgba(224,172,76,.13);border:1px solid rgba(224,172,76,.34);color:#EFD9A8;border-radius:12px;padding:11px 16px;font-size:13px;max-width:660px;margin-top:26px;line-height:1.5}
  .demo-note b{color:#F6E3B8}
  .picker-body{max-width:1080px;margin:-64px auto 0;padding:0 22px;position:relative}
  .role-grid{display:grid;grid-template-columns:1fr;gap:16px}
  @media (min-width:640px){.role-grid{grid-template-columns:1fr 1fr}}
  @media (min-width:1060px){.role-grid{grid-template-columns:repeat(4,1fr)}}
  .role-panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-lg);overflow:hidden;display:flex;flex-direction:column}
  .role-head{display:flex;align-items:center;gap:13px;padding:16px 18px 14px;border-bottom:1px solid var(--line)}
  .role-head .role-ico{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
  .role-head h3{font-size:17px}
  .role-head p{margin:1px 0 0;font-size:12px;color:var(--ink2)}
  .role-panel .personas{padding:8px;display:flex;flex-direction:column;gap:2px;flex:1}
  .persona{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border-radius:11px;padding:10px 12px;transition:background .12s}
  .persona:hover{background:var(--surface2)}
  .persona .avatar{width:38px;height:38px;font-size:13.5px}
  .persona b{display:block;font-size:14px}
  .persona .meta{display:block;font-size:12px;color:var(--ink2)}
  .persona .go{margin-left:auto;font-size:15px;font-weight:700;color:var(--ink3);opacity:.5;transition:opacity .12s,color .12s;flex:none}
  .persona:hover .go,.persona:focus-visible .go{opacity:1;color:var(--primary)}
  .rp-admin .role-ico{background:var(--accent-soft);color:var(--accent-ink)}   .rp-admin .avatar{background:var(--accent-soft);color:var(--accent-ink)}
  .rp-teacher .role-ico{background:var(--primary-soft);color:var(--primary-soft-ink)}
  .rp-parent .role-ico{background:var(--good-soft);color:var(--good)}    .rp-parent .avatar{background:var(--good-soft);color:var(--good)}
  .rp-student .role-ico{background:var(--warn-soft);color:var(--warn)}   .rp-student .avatar{background:var(--warn-soft);color:var(--warn)}
  .picker-foot{text-align:center;margin:34px 0 40px;color:var(--ink2)}
  @media (max-width:520px){.hero{padding-bottom:92px}.hero h1{margin-top:28px}}

  /* ------- app shell ------- */
  .topbar{position:sticky;top:0;z-index:40;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:10px 18px}
  .topbar .brandmark{font-size:16px}
  .topbar .bm-dot{width:26px;height:26px;font-size:13px}
  .role-pill{margin-left:2px}
  .topbar-spacer{flex:1}
  .iconbtn{position:relative;width:36px;height:36px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;font-size:17px;border:1px solid var(--line)}
  .iconbtn:hover{background:var(--surface2)}
  .badge{position:absolute;top:-5px;right:-5px;background:var(--bad);color:#fff;border-radius:99px;font-size:10.5px;font-weight:700;min-width:17px;height:17px;display:flex;align-items:center;justify-content:center;padding:0 4px}
  .whoami{display:flex;align-items:center;gap:9px}
  .whoami .avatar{width:32px;height:32px;font-size:12.5px}
  .whoami .who-name{font-size:13px;font-weight:600;line-height:1.15}
  .whoami .who-role{font-size:11px;color:var(--ink2)}
  .layout{display:flex;min-height:calc(100vh - 57px)}
  .sidenav{width:212px;flex:none;padding:18px 12px;border-right:1px solid var(--line)}
  .sidenav button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:9px 12px;border-radius:9px;font-weight:500;font-size:14px;color:var(--ink2);margin-bottom:2px}
  .sidenav button:hover{background:var(--surface2)}
  .sidenav button.on{background:var(--surface2);color:var(--ink);font-weight:600;box-shadow:inset 3px 0 0 var(--primary)}
  .sidenav button .ic{width:18px;height:18px;color:var(--ink3)}
  .sidenav button.on .ic{color:var(--primary)}
  .main{flex:1;min-width:0;padding:26px clamp(16px,3.5vw,40px) 90px;max-width:1120px}
  .page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:20px}
  .page-head h1{font-size:clamp(22px,3vw,28px)}
  .page-head .sub{color:var(--ink2);font-size:13.5px;margin-top:5px}
  .bottomnav{display:none}
  @media (max-width:880px){
    .sidenav{display:none}
    .main{padding-bottom:110px}
    .bottomnav{position:fixed;bottom:0;left:0;right:0;z-index:40;display:flex;background:var(--surface);border-top:1px solid var(--line);padding:5px 4px calc(5px + env(safe-area-inset-bottom))}
    .bottomnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:600;color:var(--ink2);padding:6px 2px;border-radius:8px}
    .bottomnav button .nav-ico{font-size:18px}
    .bottomnav button.on{color:var(--primary)}
    .whoami .who-text{display:none}
  }
  .brandmark{white-space:nowrap}
  .sync-chip{white-space:nowrap}
  @media (max-width:520px){
    .role-pill{display:none}
    .sync-chip{display:none}
    .topbar .brandmark{font-size:14px}
    .topbar{gap:9px;padding:10px 12px}
  }

  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:18px}
  .grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
  .stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:20px}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;box-shadow:var(--shadow);display:flex;gap:14px;align-items:flex-start}
  .stat .stat-ico{width:38px;height:38px;border-radius:9px;background:var(--surface2);color:var(--primary);display:flex;align-items:center;justify-content:center;flex:none;margin-top:1px}
  .stat .stat-v{font-family:"Archivo","Public Sans",sans-serif;font-size:26px;font-weight:700;margin-top:3px;letter-spacing:-.01em}
  .stat .stat-d{font-size:12px;color:var(--ink2);margin-top:2px}
  .page-head h1::before{content:"";display:block;width:34px;height:4px;border-radius:2px;background:var(--primary);margin-bottom:12px}

  .list-row{display:flex;align-items:center;gap:13px;padding:12px 0;border-top:1px solid var(--line)}
  .list-row:first-child{border-top:none}
  .list-row .grow{flex:1;min-width:0}

  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th{text-align:left;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink2);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line2);background:var(--surface2)}
  tbody tr:hover td{background:var(--surface2)}
  td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
  tr:last-child td{border-bottom:none}
  .tablewrap{overflow-x:auto}

  .course-card{display:flex;flex-direction:column;overflow:hidden}
  .course-band{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:var(--navy);color:var(--navy-ink);border-bottom:3px solid var(--primary)}
  .course-band .band-subj{font-family:"Archivo","Public Sans",sans-serif;font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
  .course-band .band-mono{width:32px;height:32px;border-radius:8px;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;font-family:"Archivo","Public Sans",sans-serif;font-weight:800;font-size:15px}
  .course-body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
  .course-body h3{font-size:17px}
  .course-foot{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:10px}
  .price{font-family:"Archivo","Public Sans",sans-serif;font-size:19px;font-weight:600}
  .price span{font-family:"Public Sans",sans-serif;font-size:12px;color:var(--ink2);font-weight:500}

  .field{margin-bottom:13px}
  .field label{display:block;font-size:12.5px;font-weight:600;margin-bottom:5px;color:var(--ink2)}
  .field-row{display:flex;gap:12px}.field-row>.field{flex:1}

  /* modal */
  .modal-veil{position:fixed;inset:0;z-index:80;background:rgba(15,25,22,.45);display:flex;align-items:flex-end;justify-content:center;padding:0}
  @media(min-width:640px){.modal-veil{align-items:center;padding:24px}}
  .modal{background:var(--surface);border-radius:18px 18px 0 0;width:100%;max-width:480px;max-height:92vh;overflow-y:auto;box-shadow:var(--shadow-lg)}
  @media(min-width:640px){.modal{border-radius:18px}}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px 0}
  .modal-head h2{font-size:19px}
  .modal-body{padding:16px 22px 24px}
  .payline{display:flex;justify-content:space-between;font-size:14px;padding:7px 0}
  .payline.total{border-top:1px solid var(--line2);font-weight:700;font-size:15px;margin-top:5px;padding-top:11px}
  .democard{background:var(--surface2);border:1px dashed var(--line2);border-radius:11px;padding:13px 15px;margin:13px 0}

  .toast-zone{position:fixed;bottom:18px;right:18px;z-index:120;display:flex;flex-direction:column;gap:9px;max-width:min(360px,calc(100vw - 36px))}
  @media(max-width:880px){.toast-zone{bottom:86px}}
  .toast{background:var(--ink);color:var(--bg);border-radius:11px;padding:11px 15px;font-size:13.5px;box-shadow:var(--shadow-lg);display:flex;gap:9px;align-items:flex-start;animation:pop .22s ease}
  @keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  .bell-menu{position:absolute;right:0;top:44px;width:min(340px,calc(100vw - 28px));background:var(--surface);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow-lg);z-index:60;overflow:hidden}
  .bell-menu .bm-head{padding:11px 15px;font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink2);border-bottom:1px solid var(--line)}
  .bell-item{padding:11px 15px;font-size:13px;border-bottom:1px solid var(--line);display:flex;gap:9px}
  .bell-item:last-child{border-bottom:none}
  .bell-item time{display:block;font-size:11px;color:var(--ink3);margin-top:2px}

  .timetable td{vertical-align:top;min-width:112px;height:48px}
  .timetable th:first-child,.timetable .tt-time{width:88px;min-width:88px}
  .tt-time{font-weight:700;color:var(--ink2);font-size:12.5px;white-space:nowrap;padding-top:14px}
  .tt-item{background:var(--navy);color:var(--navy-ink);border-left:3px solid var(--primary);border-radius:7px;padding:7px 10px;font-size:12px;margin:2px 0;min-width:128px}
  .tt-item b{display:block;font-size:12.5px;line-height:1.3}
  .tt-item span{opacity:.75;font-size:11px}
  th.tt-today{color:var(--primary)}
  .timetable td.tt-col-today{background:var(--surface2)}
  .timetable tbody tr:hover td{background:transparent}
  .timetable tbody tr:hover td.tt-col-today{background:var(--surface2)}
  .sched-day{margin-bottom:16px}
  .sched-day h3{font-size:13px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink2);font-family:"Public Sans",sans-serif;font-weight:700;margin-bottom:7px}
  .sess{display:flex;align-items:center;gap:13px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--primary);border-radius:10px;padding:11px 14px;margin-bottom:8px}
  .sess .sess-time{font-variant-numeric:tabular-nums;font-weight:700;font-size:13.5px;min-width:72px}

  .timeline{position:relative;padding-left:22px}
  .timeline::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--line2);border-radius:2px}
  .tl-item{position:relative;padding-bottom:18px}
  .tl-item::before{content:"";position:absolute;left:-21px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--primary);border:2.5px solid var(--bg)}

  .barchart .bar-row{display:grid;grid-template-columns:fit-content(132px) 1fr 64px;align-items:center;gap:10px;margin-bottom:9px;font-size:12.5px}
  .barchart .bar-row span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:132px}
  .barchart .bar-track{height:22px;border-radius:5px;background:var(--surface2);overflow:hidden}
  .barchart .bar-fill{display:block;height:100%;background:var(--primary);border-radius:0 4px 4px 0;min-width:2px}
  .barchart .bar-val{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink2)}

  .spin{width:20px;height:20px;border:2.5px solid var(--primary-soft);border-top-color:var(--primary);border-radius:50%;animation:sp 0.8s linear infinite;display:inline-block;vertical-align:middle}
  @keyframes sp{to{transform:rotate(360deg)}}
  .success-blob{width:62px;height:62px;border-radius:50%;background:var(--good-soft);color:var(--good);display:flex;align-items:center;justify-content:center;font-size:30px;margin:6px auto 14px}

/* ---------- cloud sync (Supabase) ----------
   State lives in one jsonb row (id=1). Every device pushes on change and
   polls for newer versions, so actions on a phone appear on a laptop in ~2s.
   If the cloud is unreachable (e.g. inside the claude.ai artifact sandbox),
   the demo silently falls back to this-device-only mode. */
const CLOUD = {
  url: "https://wmulemkyjrjetwyzrsqq.supabase.co",
  key: "sb_publishable_VPc25AP9EqO2on4Szh7ghQ_TsMJJu9W",
  table: "brightway_demo_state"
};
let syncState = "connecting";
function syncChip(){
  return syncState==="live" ? `<span class="chip chip-good sync-chip" title="Synced across all devices">● Live sync</span>`
       : syncState==="offline" ? `<span class="chip chip-muted sync-chip" title="Cloud not reachable — changes stay on this device">● This device</span>`
       : `<span class="chip chip-muted sync-chip">● Connecting</span>`;
}
function setSync(s){
  if(syncState===s) return;
  syncState = s;
  const el = document.querySelector(".sync-chip");
  if(el){ const tmp=document.createElement("span"); tmp.innerHTML=syncChip(); el.replaceWith(tmp.firstChild); }
}
function cloudHeaders(){ return {apikey:CLOUD.key, Authorization:"Bearer "+CLOUD.key, "Content-Type":"application/json"}; }
let pushTimer = null;
function schedulePush(){ clearTimeout(pushTimer); pushTimer = setTimeout(pushCloud, 300); }
async function pushCloud(){
  try{
    const r = await fetch(CLOUD.url+"/rest/v1/"+CLOUD.table+"?on_conflict=id", {
      method:"POST",
      headers:Object.assign(cloudHeaders(), {Prefer:"resolution=merge-duplicates,return=minimal"}),
      body:JSON.stringify([{id:1, version:S.version, state:S}])
    });
    setSync(r.ok ? "live" : "offline");
  }catch(e){ setSync("offline"); }
}
let polling = false;
async function pollCloud(){
  if(polling) return; polling = true;
  try{
    const r = await fetch(CLOUD.url+"/rest/v1/"+CLOUD.table+"?id=eq.1&select=version,state", {headers:cloudHeaders()});
    if(!r.ok) throw new Error("http "+r.status);
    const rows = await r.json();
    const row = rows && rows[0];
    if(!row){ await pushCloud(); }
    else if((row.version||0) > (S.version||0)){
      const prevIds = new Set(S.events.map(ev=>ev.id));
      S = row.state; S.version = row.version;
      ["attendance","exams","results","complaints"].forEach(k=>{ S[k]=S[k]||[]; });
      try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){}
      const sess = getSess();
      S.events.filter(ev=>!prevIds.has(ev.id) && eventFor(ev,sess)).slice(0,3).reverse().forEach(ev=>toast(ev.icon+" "+ev.text));
      const y = window.scrollY; render(); window.scrollTo(0, y);
      setSync("live");
    }
    else if((row.version||0) < (S.version||0)){ await pushCloud(); }
    else setSync("live");
  }catch(e){ setSync("offline"); }
  polling = false;
}
setInterval(pollCloud, 2500);
pollCloud();

});

function nextSessionsFor(courses, limit){
  const today = new Date().getDay();
  const out = [];
  courses.forEach(c=>c.schedule.forEach(s=>{
    let offset = (DAYS.indexOf(s.day) - today + 7) % 7;
    out.push({course:c, day:s.day, time:s.time, offset});
  }));
  out.sort((a,b)=> a.offset-b.offset || a.time.localeCompare(b.time));
  return out.slice(0, limit||3);
}

function scheduleView(courses){
  const order = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  const sess = [];
  courses.forEach(c=>c.schedule.forEach(s=>sess.push({c, day:s.day, time:s.time})));
  if(!sess.length) return `<div class="empty">Nothing scheduled yet.</div>`;
  const times = [...new Set(sess.map(s=>s.time))].sort();
  const todayName = DAYS[new Date().getDay()];
  const cell = (d,t) => sess.filter(s=>s.day===d && s.time===t).map(s=>{
    const n = rosterForCourse(s.c.id).length;
    return `<div class="tt-item"><b>${esc(s.c.title)}</b><span>${esc((user(s.c.teacherId)||{}).name||"")} · ${n} student${n===1?"":"s"}</span></div>`;
  }).join("");
  return `<div class="card tablewrap"><table class="timetable">
    <thead><tr><th>Time</th>${order.map(d=>`<th class="${d===todayName?"tt-today":""}">${d}${d===todayName?" · today":""}</th>`).join("")}</tr></thead>
    <tbody>${times.map(t=>`<tr><td class="tt-time num">${fmtTime(t)}</td>${order.map(d=>`<td class="${d===todayName?"tt-col-today":""}">${cell(d,t)}</td>`).join("")}</tr>`).join("")}</tbody>
  </table></div>`;
}

function monthKey(ts){ const d=new Date(ts); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }
function monthLabel(k){ const [y,m]=k.split("-"); return new Date(y, m-1, 1).toLocaleDateString(undefined,{month:"short"}); }
function revenueByMonth(n){
  const out=[]; const d=new Date(); d.setDate(1);
  for(let i=n-1;i>=0;i--){ const dd=new Date(d.getFullYear(), d.getMonth()-i, 1); out.push({key:monthKey(dd.getTime()), label:monthLabel(monthKey(dd.getTime())), value:0}); }
  S.payments.filter(p=>p.status==="paid").forEach(p=>{ const row=out.find(r=>r.key===monthKey(p.ts)); if(row) row.value+=p.amount; });
  return out;
}
function barChart(rows, fmt){
  const max = Math.max(1, ...rows.map(r=>r.value));
  return `<div class="barchart">${rows.map(r=>`<div class="bar-row">
    <span class="muted">${esc(r.label)}</span>
    <span class="bar-track"><span class="bar-fill" style="width:${Math.round(r.value/max*100)}%"></span></span>
    <span class="bar-val">${fmt(r.value)}</span></div>`).join("")}</div>`;
}

function dateSheetView(courseIds, intro){
  const set = new Set(courseIds);
  const rows = (S.exams||[]).filter(e=>set.has(e.courseId)).sort((a,b)=>a.date<b.date?-1:1);
  if(!rows.length) return `<div class="empty">No exams scheduled yet.</div>`;
  const today = new Date().toISOString().slice(0,10);
  const soonCut = new Date(Date.now()+7*DAY).toISOString().slice(0,10);
  return `<div class="card tablewrap"><table>
    <thead><tr><th>Date</th><th>Time</th><th>Exam</th><th>Class</th><th>Room</th><th></th></tr></thead>
    <tbody>${rows.map(e=>{
      const c = course(e.courseId)||{};
      const past = e.date < today;
      const soon = !past && e.date <= soonCut;
      return `<tr${past?' style="opacity:.55"':''}><td class="num"><b>${fmtDateStr(e.date)}</b></td><td class="num">${fmtTime(e.time)}</td>
        <td><b>${esc(e.title)}</b></td><td class="muted">${esc(c.title||"—")}</td><td class="muted">${esc(e.room||"—")}</td>
        <td>${past?'<span class="chip chip-muted">Done</span>':soon?'<span class="chip chip-primary">Soon</span>':""}</td></tr>`;
    }).join("")}</tbody>
  </table></div>`;
}

const ACTIONS = {
  signIn(id){ const u=user(id); if(!u) return; setSess({userId:id, role:u.role, view:"dashboard", courseId:null, childId:null, bellOpen:false}); render(); window.scrollTo(0,0); },
  signOut(){ sessionStorage.removeItem("bw-sess"); render(); window.scrollTo(0,0); },
  go(v){ setSess({view:v, courseId:null, childId:null, q:"", tab:null, bellOpen:false}); render(); window.scrollTo(0,0); },
  goChild(id){ setSess({view:"childview", childId:id, bellOpen:false}); render(); window.scrollTo(0,0); },
  openCourse(id){ setSess({courseId:id}); render(); window.scrollTo(0,0); },
  closeCourse(){ setSess({courseId:null}); render(); },
  userTab(t){ setSess({tab:t}); render(); },
  toggleBell(){ setSess({bellOpen:!getSess().bellOpen}); render(); },
  veil(){ closeModal(); },
  closeModal(){ closeModal(); },
  openEnroll(id){ const kids=childrenOf(getSess().userId); if(!kids.length){ toast("Add a child first (My children)."); return; } if(kids.every(k=>isEnrolled(id,k.id))){ toast("All your children are already enrolled in this class."); return; } enrollModal(id,"form"); },
  openReview(id){ reviewModal(id); },
  openProgress(){ progressModal(); },
  openProgressFor(arg){ const [child, crs]=arg.split("|"); progressModal(child, crs); },
  attClass(id){ setSess({attClass:id}); render(); },
  resExam(id){ setSess({resExam:id}); render(); },
  adAttClass(id){ setSess({adAttClass:id}); render(); },
  invoice(id){ invoiceModal(id); },
  openRecordPay(){ recordPayModal(); },
  openRegParent(){ regParentModal(); },
  openApplyTeacher(){ applyTeacherModal(); },
  openAddUser(){ addUserModal("parent"); },
  addUserRole(r){ addUserModal(r); },
  editCourse(id){ editCourseModal(id); },
  openRespond(id){ respondModal(id); },
  saveResult(arg){
    const [examId, childId] = arg.split("|");
    const inp = document.querySelector(`[data-res-input="${childId}"]`);
    const marks = Number(inp && inp.value);
    if(inp==null || inp.value==="" || isNaN(marks) || marks<0 || marks>100){ toast("Enter marks between 0 and 100."); return; }
    const ex = exam(examId), k = user(childId), me = user(getSess().userId);
    if(!ex||!k) return;
    const c = course(ex.courseId)||{};
    commit(()=>{
      S.results = S.results || [];
      const r = S.results.find(x=>x.examId===examId && x.childId===childId);
      if(r){ r.marks = marks; r.ts = Date.now(); }
      else S.results.push({id:uid("rs"), examId, childId, marks, teacherId:me.id, ts:Date.now()});
      addEvent("🏅", "Result published: "+k.name+" scored "+marks+"/100 ("+gradeOf(marks)+") in "+ex.title+" — "+(c.title||"")+".", [], [k.parentId, childId]);
    });
    toast("Result saved — the family can see it now.");
  },
  markAtt(arg){
    const [childId, courseId, date, status] = arg.split("|");
    const k = user(childId), c = course(courseId), me = user(getSess().userId);
    if(!k || !c) return;
    commit(()=>{
      S.attendance = S.attendance || [];
      const rec = S.attendance.find(a=>a.childId===childId && a.courseId===courseId && a.date===date);
      if(rec) rec.status = status;
      else S.attendance.push({id:uid("at"), childId, courseId, teacherId:me.id, date, status});
      if(status==="absent") addEvent("📋", k.name+" was marked absent from "+c.title+" ("+fmtDateStr(date)+").", [], [k.parentId]);
      if(status==="late")   addEvent("📋", k.name+" arrived late to "+c.title+" ("+fmtDateStr(date)+").", [], [k.parentId]);
    });
  },
  approveTeacher(id){
    commit(()=>{ const t=user(id); if(t){ t.status="active"; addEvent("🎉","Your teacher account was approved — welcome aboard!",[],[id]); addEvent("👩‍🏫", t.name+" was approved as a teacher.", ["admin"], []); } });
    toast("Teacher approved — their account is live.");
  },
  toggleCourse(id){ commit(()=>{ const c=course(id); if(c){ c.status = c.status==="active"?"draft":"active"; if(c.status==="active") addEvent("📚","New class available: "+c.title+".",["parent"],[]); } }); },
  refund(id){
    commit(()=>{ const p=S.payments.find(x=>x.id===id); if(p){ p.status="refunded"; addEvent("↩️","Your payment of "+money(p.amount)+" for "+((course(p.courseId)||{}).title||"a class")+" was refunded.",[],[p.parentId]); } });
    toast("Payment refunded. The parent has been notified.");
  },
  reviewSet(arg){
    const [id, status] = arg.split("|");
    commit(()=>{ const rv=S.reviews.find(x=>x.id===id); if(!rv) return; rv.status=status;
      const c=course(rv.courseId)||{};
      if(status==="approved"){ addEvent("⭐","Your review of "+ (c.title||"a class") +" was published.",[],[rv.parentId]); addEvent("⭐","A new "+rv.rating+"-star review was published on "+(c.title||"your class")+".",[],[c.teacherId]); }
      else addEvent("💬","Your review of "+(c.title||"a class")+" wasn’t published this time.",[],[rv.parentId]);
    });
    toast(status==="approved"?"Review published to the class page.":"Review rejected.");
  },
  resetDemo(){
    if(!confirm("Reset all demo data back to the starting state? Every device using this demo will update.")) return;
    const v = S.version || 0;
    S = seedState(); S.version = v;
    save(); render(); toast("Demo data has been reset everywhere.");
  }
};

    else if(aud.startsWith("role:")){ const r=aud.slice(5); roles=[r]; label = r==="child" ? "all students" : "all "+r+"s"; }
    else if(aud.startsWith("user:")){ const u=user(aud.slice(5)); if(!u) return; userIds=[u.id]; label=u.name; }

      S.exams = S.exams || [];
      S.exams.push({id:uid("ex"), courseId, title, date, time, room:(fd.get("room")||"").trim()});
      addEvent("📝","Exam scheduled: "+title+" for "+c.title+" on "+fmtDateStr(date)+" at "+fmtTime(time)+".",["parent","child"],[c.teacherId]);
    });
    toast("Added to the date sheet — families and the teacher have been notified.");
  },
  addCourse(fd){
    const title=(fd.get("title")||"").trim(); if(!title) return;
    commit(()=>{
      S.courses.push({id:uid("crs"), title, subject:(fd.get("subject")||"General").trim(), icon:(fd.get("icon")||"📚").trim()||"📚",
        teacherId:fd.get("teacherId"), price:Number(fd.get("price"))||100, desc:(fd.get("desc")||"").trim()||"A brand-new class at Brightway Academy.",
        schedule:[{day:fd.get("day")||"Mon", time:fd.get("time")||"16:00"}], status:"active"});
      addEvent("📚","New class available: "+title+". Take a look!",["parent"],[]);
      addEvent("📚","You’ve been assigned a new class: "+title+".",[],[fd.get("teacherId")]);
    });
    toast("Class added — parents can enrol right away.");
  }
};

/* delegation */
document.addEventListener("click", e=>{
  const stop = e.target.closest("[data-stop]");
  const el = e.target.closest("[data-act]");
  if(!el){ if(!stop && document.querySelector(".bell-menu")){ setSess({bellOpen:false}); render(); } return; }
  if(el.dataset.act==="veil" && stop) return;
  const fn = ACTIONS[el.dataset.act];
  if(fn) fn(el.dataset.arg, el);
});
document.addEventListener("submit", e=>{
  const f = e.target;
  if(f.dataset.form && FORMS[f.dataset.form]){ e.preventDefault(); FORMS[f.dataset.form](new FormData(f), f); }
});
document.addEventListener("input", e=>{
  if(e.target.dataset.input==="attdate"){
    if(e.target.value){ setSess({attDate:e.target.value}); render(); }
    return;
  }
  if(e.target.dataset.input==="search"){
    setSess({q:e.target.value});
    const grid=document.querySelector(".grid3"); // light re-render, keep focus
    const y=window.scrollY; const val=e.target.value; render(); window.scrollTo(0,y);
    const inp=document.querySelector('[data-input="search"]'); if(inp){ inp.focus(); inp.setSelectionRange(val.length,val.length); }
  }
});

render();
</script>

</html>
